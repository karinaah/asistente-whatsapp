<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | AURA</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AURA</h1>
            <p>Tu asistente personal de planificación.</p>
        </div>

        <div class="login-section">
            <h2>Crear cuenta</h2>
            <p>Regístrate para comenzar a organizar tu día con AURA.</p>

            {% if error %}
                <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}

            <form action="/auth/register/form" method="post">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="12"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit">Crear cuenta</button>
            </form>

            <p>
                ¿Ya tienes una cuenta?
                <a href="/auth/login">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
