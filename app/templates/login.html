<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | AURA</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>AURA</h1>
            <p>Tu asistente personal de planificación.</p>
        </div>

        <div class="login-section">
            <h2>Iniciar sesión</h2>

            <p>
                Ingresa tus credenciales para acceder
                a tu espacio personal.
            </p>

            {% if error %}
                <p class="login-error" role="alert">
                    {{ error }}
                </p>
            {% endif %}

            <form action="/auth/login/form" method="post">

                <div class="form-group">
                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    Iniciar sesión
                </button>
            </form>

            <p>
                ¿Todavía no tienes una cuenta?
                <a href="/auth/register">Regístrate aquí</a>
            </p>
        </div>

    </div>
</body>
</html>
