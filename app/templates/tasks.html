<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas - AURA</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/web">Hoy</a>
            |
            <a href="/web/tasks">Tareas</a>
        </nav>

        <h1>Tareas</h1>

        <p>Total de tareas: {{ tasks | length }}</p>

        {% for task in tasks %}
            <div class="task-card task-{{ task.status.value }}">
                <div class="task-title">
                    {{ task.title }}
                </div>

                <p class="task-meta">
                    Estado: {{ task.status.value }}
                    |
                    Prioridad: {{ task.priority.value }}
                    |
                    Categoría: {{ task.category.value }}
                </p>
             

                {% if task.status.value != "completada" %}
                    <form method="post" action="/web/tasks/{{ task.id }}/complete">
                        <button type="submit" class="complete-button">
                            Completar
                        </button>
                    </form>
                {% endif %}


                <form
                    method="post"
                    action="/web/tasks/{{ task.id }}/delete"
                    onsubmit="return confirm('¿Seguro que quieres eliminar esta tarea?');"
                >

                    <button type="submit">
                        Eliminar
                    </button>
                </form>                


            </div>
        {% endfor %}

    </div>
</body>
</html>
